<section id="settings" class="page-view" data-page="cai-dat">
          <div class="single-column page-stack">
            <article class="panel">
              <div class="panel-heading">
                <div>
                  <h2>Tùy chỉnh giao diện</h2>
                  <p>
                    Chọn kiểu hiển thị phù hợp với môi trường làm việc và thói
                    quen đọc dữ liệu.
                  </p>
                </div>
              </div>
              <form id="settings-form" class="settings-form">
                <label>
                  Chế độ màu
                  <select name="theme">
                    <option value="light">Sáng</option>
                    <option value="dark">Tối</option>
                  </select>
                </label>
                <label>
                  Màu nền
                  <select name="background">
                    <option value="default">Mặc định</option>
                    <option value="soft-green">Xanh dịu</option>
                    <option value="warm">Ấm</option>
                  </select>
                </label>
                <label>
                  Tông màu
                  <select name="accent">
                    <option value="teal">Xanh ngọc</option>
                    <option value="blue">Xanh dương</option>
                    <option value="violet">Tím than</option>
                  </select>
                </label>
                <label>
                  Cỡ chữ
                  <select name="textSize">
                    <option value="compact">Gọn</option>
                    <option value="comfortable">Vừa</option>
                    <option value="large">Lớn</option>
                  </select>
                </label>
              </form>
            </article>
          </div>
        </section>
