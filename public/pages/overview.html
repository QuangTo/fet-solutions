<section id="dashboard" class="page-view" data-page="tong-quan">
          <div class="metric-grid" aria-label="Chỉ số tổng quan">
            <article class="metric">
              <span>Tổng hàng đã nhập</span>
              <strong id="total-invoiced">0</strong>
              <small>theo số lượng quy đổi</small>
            </article>
            <article class="metric">
              <span>Đã xuất lên xe</span>
              <strong id="total-dispatched">0</strong>
              <small>căn cứ để đối soát</small>
            </article>
            <article class="metric">
              <span>Còn trong kho</span>
              <strong id="total-remaining">0</strong>
              <small>theo từng loại hàng</small>
            </article>
          </div>
          <article class="panel">
            <div class="panel-heading">
              <div>
                <h2>Tổng quan khách hàng</h2>
                <p>
                  Xem nhanh lượng hàng còn lại và mở chi tiết của từng khách
                  hàng.
                </p>
              </div>
            </div>
            <div id="customer-grid" class="customer-grid"></div>
            <div id="customer-pagination" class="pagination"></div>
          </article>

          <article class="panel">
            <div class="panel-heading">
              <div>
                <h2>Xu hướng tồn kho</h2>
                <p>Theo dõi tổng lượng hàng tăng giảm trong tháng hiện tại.</p>
              </div>
            </div>
            <div
              id="inventory-chart"
              class="inventory-chart"
              aria-label="Biểu đồ đường thể hiện tồn kho trong tháng"
            ></div>
          </article>
        </section>
